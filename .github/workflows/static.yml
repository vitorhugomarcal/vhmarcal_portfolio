name: Validate portfolio

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run assets:check
      - name: Validate production routes and SEO
        run: |
          npm run start -- --hostname localhost --port 3000 > /tmp/portfolio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run seo:check
